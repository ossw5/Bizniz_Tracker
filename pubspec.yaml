name: bizniz_tracker
description: "A business sales and inventory tracker."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  intl: ^0.20.2
  dartz: ^0.10.1
  google_fonts: ^6.3.2
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  flutter_riverpod: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

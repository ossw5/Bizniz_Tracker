name: bizniz_tracker
description: "A business sales and inventory tracker."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  intl: ^0.20.2
  dartz: ^0.10.1
  google_fonts: ^6.3.2
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  flutter_riverpod: ^3.0.3
  mobile_scanner: ^7.5.0
  pdf: ^3.13.1
  printing: ^5.15.1
  file_saver: ^0.7.0
  file_picker: ^13.3.2
  drift: 2.22.1
  drift_flutter: 0.2.0
  archive: ^4.7.1
  cryptography: ^2.9.0
  share_plus: ^13.3.1
  cryptography_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: lib/LogoPics/BTLogo.jpe
  adaptive_icon_background: "#EFF3F2"
  adaptive_icon_foreground: lib/LogoPics/BTLogo.jpe
